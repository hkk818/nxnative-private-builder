name: Build nxnative IPA
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: true
        default: 'v1.0'

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: 1. 安装编译依赖
        run: |
          brew install xcodegen zstd spirv-cross
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 capstone fonttools || python3 -m pip install lz4 capstone fonttools

      - name: 2. 拉取 nxnative 源码并打印目录结构
        run: |
          git clone --depth 1 https://github.com/seedds/nxnative.git nxnative
          echo "=== 根目录文件列表 ==="
          ls -la nxnative
          echo "=== scripts 目录脚本 ==="
          ls -la nxnative/scripts || true

      - name: 3. 下载并解压 exefs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}
        run: |
          mkdir -p ~/.switch raw_dl extracted_exefs
          if [ -n "$KEYS_B64" ]; then
            echo "$KEYS_B64" | base64 --decode > ~/.switch/prod.keys
          fi
          gh release download "v1.0" --repo "${{ github.repository }}" --dir raw_dl --pattern "exefs.zip" --clobber
          python3 -c '
          import zipfile, os
          with zipfile.ZipFile("raw_dl/exefs.zip", "r") as z:
              for info in z.infolist():
                  fname = info.filename.replace("\\", "/")
                  if not fname.endswith("/"):
                      target = os.path.join("extracted_exefs", fname)
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with open(target, "wb") as out:
                          out.write(z.read(info.filename))
          '
          if [ -d "extracted_exefs/exefs" ]; then
            cp -r extracted_exefs/exefs/* nxnative/
          fi

      - name: 4. 自动定位编译脚本并打包 IPA
        run: |
          cd nxnative
          # 自动寻找 scripts 目录下的构建脚本或 python 文件
          BUILD_SCRIPT=$(find scripts -maxdepth 2 -name "*.py" -o -name "*.sh" | head -n 1)
          echo "找到构建脚本: $BUILD_SCRIPT"
          
          if [ -n "$BUILD_SCRIPT" ]; then
            python3 "$BUILD_SCRIPT" . -k ~/.switch/prod.keys -o "${{ github.workspace }}/final_output/nxnative-game-shell.ipa" || \
            python3 "$BUILD_SCRIPT" || true
          fi

          # 兜底：若未生成，尝试直接用 xcodegen 编译
          if [ ! -f "${{ github.workspace }}/final_output/nxnative-game-shell.ipa" ]; then
            xcodegen generate || true
            xcodebuild -project smbw-mobile.xcodeproj -scheme smbw-mobile -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED=NO || true
          fi

          mkdir -p "${{ github.workspace }}/final_output"
          APP_DIR=$(find . -type d -name "*.app" | head -n 1)
          if [ -n "$APP_DIR" ]; then
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.increased-memory-limit bool true" "$APP_DIR/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.extended-virtual-addressing bool true" "$APP_DIR/Info.plist" 2>/dev/null || true
            mkdir -p Payload
            cp -r "$APP_DIR" Payload/
            zip -r9 "${{ github.workspace }}/final_output/nxnative-game-shell.ipa" Payload
          fi
          ls -la "${{ github.workspace }}/final_output"

      - name: 5. 上传生成的无签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-output-ipa
          path: ${{ github.workspace }}/final_output/*.ipa
          if-no-files-found: error
          retention-days: 3
