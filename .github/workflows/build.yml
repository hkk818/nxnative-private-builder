name: Build nxnative IPA
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: true
        default: 'v1.0'

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: 1. 安装编译依赖
        run: |
          brew install xcodegen zstd spirv-cross
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 capstone fonttools || python3 -m pip install lz4 capstone fonttools

      - name: 2. 拉取 nxnative 源码
        run: |
          git clone --depth 1 https://github.com/seedds/nxnative.git nxnative

      - name: 3. 下载并还原 exefs 与密钥
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}
        run: |
          mkdir -p ~/.switch raw_dl extracted_game
          if [ -n "$KEYS_B64" ]; then
            echo "$KEYS_B64" | base64 --decode > ~/.switch/prod.keys
          fi
          gh release download "v1.0" --repo "${{ github.repository }}" --dir raw_dl --pattern "exefs.zip" --clobber
          python3 -c '
          import zipfile, os
          with zipfile.ZipFile("raw_dl/exefs.zip", "r") as z:
              for info in z.infolist():
                  fname = info.filename.replace("\\", "/")
                  if not fname.endswith("/"):
                      target = os.path.join("extracted_game", fname)
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with open(target, "wb") as out:
                          out.write(z.read(info.filename))
          '
          if [ -d "extracted_game/exefs" ]; then
            cp -r extracted_game/exefs/* nxnative/
          fi
          ls -la nxnative

      - name: 4. 直接调用 build.py 或 XcodeGen 构建空壳 IPA
        run: |
          cd nxnative
          # 如果源码根目录有 build.py 或脚本，直接运行；否则利用 xcodegen 生成工程编译
          if [ -f "build.py" ]; then
            python3 build.py --platform ios -o "${{ github.workspace }}/nxnative-game-shell.ipa"
          else
            python3 -c 'import os; print(os.listdir("."))'
            # 兼容处理：直接使用 cmake / xcodegen 编译
            mkdir -p build && cd build
            cmake .. -GNinja -DCMAKE_SYSTEM_NAME=iOS
            ninja || true
          fi

          APP_DIR=$(find . -type d -name "*.app" | head -n 1)
          if [ -n "$APP_DIR" ]; then
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.increased-memory-limit bool true" "$APP_DIR/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.extended-virtual-addressing bool true" "$APP_DIR/Info.plist" 2>/dev/null || true
            mkdir -p Payload
            cp -r "$APP_DIR" Payload/
            zip -r9 "${{ github.workspace }}/nxnative-game-shell.ipa" Payload
          fi

      - name: 5. 上传无签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-output-ipa
          path: |
            ${{ github.workspace }}/*.ipa
            nxnative/**/*.ipa
          if-no-files-found: error
          retention-days: 3
