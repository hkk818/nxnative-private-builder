name: Build nxnative IPA
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: true
        default: 'v1.0'

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: 1. 安装编译依赖
        run: |
          brew install xcodegen zstd spirv-cross llvm
          brew install --cask dotnet-sdk || true
          python3 -m pip install --break-system-packages lz4 capstone unicorn fonttools pillow numpy pycryptodome || python3 -m pip install lz4 capstone unicorn fonttools pillow numpy pycryptodome

      - name: 2. 拉取 nxnative 源码并查看结构
        run: |
          git clone --depth 1 https://github.com/seedds/nxnative.git nxnative
          echo "=== nxnative 目录树 ==="
          find nxnative -maxdepth 3 -not -path '*/.*'
          if [ -f "nxnative/README.md" ]; then
            echo "=== nxnative README.md ==="
            cat nxnative/README.md
          fi

      - name: 3. 下载并还原本地已解包的 exefs 与 control
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}
        run: |
          mkdir -p ~/.switch raw_dl extracted_exefs
          if [ -n "$KEYS_B64" ]; then
            echo "$KEYS_B64" | base64 --decode > ~/.switch/prod.keys
            cp ~/.switch/prod.keys nxnative/prod.keys
          fi
          gh release download "v1.0" --repo "${{ github.repository }}" --dir raw_dl --pattern "exefs_ready.zip" --clobber
          python3 -c '
          import zipfile, os
          with zipfile.ZipFile("raw_dl/exefs_ready.zip", "r") as z:
              for info in z.infolist():
                  fname = info.filename.replace("\\", "/")
                  if not fname.endswith("/"):
                      target = os.path.join("extracted_exefs", fname)
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with open(target, "wb") as out:
                          out.write(z.read(info.filename))
          '
          ls -la extracted_exefs/exefs
          ls -la extracted_exefs/control || true

      - name: 4. 执行静态重编译并生成 iPhone 16 Pro 专用 IPA
        run: |
          set -x
          WORKSPACE_ROOT="${{ github.workspace }}"
          EXEFS_SRC="$WORKSPACE_ROOT/extracted_exefs/exefs"
          CTRL_SRC="$WORKSPACE_ROOT/extracted_exefs/control"
          cd "$WORKSPACE_ROOT/nxnative"

          echo "=== 扫描 nxnative 内部构建脚本与配置文件 ==="
          find . -maxdepth 4 \( -name "*.yml" -o -name "*.sh" -o -name "*.py" -o -name "Makefile" -o -name "CMakeLists.txt" \)

          # 准备常见目录映射
          mkdir -p ExeFS exefs control
          cp -f "$EXEFS_SRC"/* ExeFS/ 2>/dev/null || true
          cp -f "$EXEFS_SRC"/* exefs/ 2>/dev/null || true
          cp -f "$EXEFS_SRC"/* ./ 2>/dev/null || true
          if [ -d "$CTRL_SRC" ]; then
            cp -f "$CTRL_SRC"/* control/ 2>/dev/null || true
            cp -f "$CTRL_SRC"/* ./ 2>/dev/null || true
          fi

          # 如果存在 setup.sh，打印其用法并尝试运行
          if [ -f "./setup.sh" ]; then
            head -n 60 ./setup.sh
            chmod +x ./setup.sh
            ./setup.sh || true
          fi

          # 自动查找 project.yml 所在目录
          PROJ_YML=$(find . -name "project.yml" | head -n 1)
          if [ -n "$PROJ_YML" ]; then
            PROJ_DIR=$(dirname "$PROJ_YML")
            echo "进入 XcodeGen 目录: $PROJ_DIR"
            cd "$PROJ_DIR"

            if [ -f "./run.sh" ]; then
              head -n 60 ./run.sh
              chmod +x ./run.sh
              DM_FREE_ACCOUNT=1 ./run.sh build || true
            fi

            if [ -f "tools/gen_build.py" ] && [ ! -d "Gen" ]; then
              python3 tools/gen_build.py || true
            fi

            xcodegen generate
            XCODEPROJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
            SCHEME=$(xcodebuild -project "$XCODEPROJ" -list | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')
            xcodebuild -project "$XCODEPROJ" \
              -scheme "$SCHEME" \
              -sdk iphoneos \
              -configuration Release \
              -derivedDataPath "$WORKSPACE_ROOT/DerivedData" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_ENTITLEMENTS="" \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "仓库中未直接包含静态 project.yml，打印主入口脚本内容以供检查："
            for f in $(find . -maxdepth 3 \( -name "*.sh" -o -name "*.py" \) | head -n 10); do
              echo "--- FILE: $f ---"
              head -n 80 "$f"
            done
            exit 1
          fi

          APP_DIR=$(find "$WORKSPACE_ROOT" -type d -name "*.app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "错误: 未能生成 .app 目录！"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.increased-memory-limit bool true" "$APP_DIR/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.extended-virtual-addressing bool true" "$APP_DIR/Info.plist" 2>/dev/null || true

          mkdir -p "$WORKSPACE_ROOT/final_output" "$WORKSPACE_ROOT/Payload"
          cp -r "$APP_DIR" "$WORKSPACE_ROOT/Payload/"
          cd "$WORKSPACE_ROOT"
          zip -r9 "$WORKSPACE_ROOT/final_output/nxnative-game-shell.ipa" Payload
          ls -la "$WORKSPACE_ROOT/final_output"

      - name: 5. 上传生成的无签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-output-ipa
          path: ${{ github.workspace }}/final_output/*.ipa
          if-no-files-found: error
          retention-days: 3