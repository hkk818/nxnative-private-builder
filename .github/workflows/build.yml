name: Build nxnative IPA
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: true
        default: 'v1.0'

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: 1. 安装编译依赖
        run: |
          brew install xcodegen zstd spirv-cross
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 capstone fonttools || python3 -m pip install lz4 capstone fonttools

      - name: 2. 拉取 nxnative 源码
        run: |
          git clone --depth 1 https://github.com/seedds/nxnative.git nxnative

      - name: 3. 下载并还原本地已解包的 exefs 代码与密钥
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}
        run: |
          mkdir -p ~/.switch raw_dl extracted_exefs
          if [ -n "$KEYS_B64" ]; then
            echo "$KEYS_B64" | base64 --decode > ~/.switch/prod.keys
            cp ~/.switch/prod.keys nxnative/prod.keys
          fi
          gh release download "v1.0" --repo "${{ github.repository }}" --dir raw_dl --pattern "exefs_ready.zip" --clobber
          python3 -c '
          import zipfile, os
          with zipfile.ZipFile("raw_dl/exefs_ready.zip", "r") as z:
              for info in z.infolist():
                  fname = info.filename.replace("\\", "/")
                  if not fname.endswith("/"):
                      target = os.path.join("extracted_exefs", fname)
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with open(target, "wb") as out:
                          out.write(z.read(info.filename))
          '
          # 将解包好的 exefs 直接覆盖进源码的工作目录
          if [ -d "extracted_exefs/exefs" ]; then
            cp -r extracted_exefs/exefs/* nxnative/
          fi
          ls -la nxnative

      - name: 4. 执行静态重编译并生成 iPhone 16 Pro 专用的空壳 IPA
        run: |
          cd nxnative
          # 利用 nxnative 源码内置的编译入口直接将 exefs 转换为 Metal 架构并打包
          # 如果源码根目录有 build.py 或类似编译脚本，直接调用；否则运行 xcodegen
          if [ -f "build.py" ]; then
            python3 build.py --platform ios -o "${{ github.workspace }}/final_output/nxnative-game-shell.ipa"
          else
            xcodegen generate
            xcodebuild -project smbw-mobile.xcodeproj -scheme smbw-mobile -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED=NO
          fi

          # 确保注入 16 Pro 高内存权限 (increased-memory-limit)
          APP_DIR=$(find . -type d -name "*.app" | head -n 1)
          if [ -n "$APP_DIR" ]; then
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.increased-memory-limit bool true" "$APP_DIR/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.extended-virtual-addressing bool true" "$APP_DIR/Info.plist" 2>/dev/null || true
            mkdir -p "${{ github.workspace }}/final_output"
            mkdir -p Payload
            cp -r "$APP_DIR" Payload/
            zip -r9 "${{ github.workspace }}/final_output/nxnative-game-shell.ipa" Payload
          fi
          ls -la "${{ github.workspace }}/final_output"

      - name: 5. 上传生成的无签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-output-ipa
          path: ${{ github.workspace }}/final_output/*.ipa
          if-no-files-found: error
          retention-days: 3
