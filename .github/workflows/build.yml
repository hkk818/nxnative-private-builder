name: Build nxnative IPA
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: true
        default: 'v1.0'

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: 1. 安装官方指定的全部编译依赖
        run: |
          brew install xcodegen zstd spirv-cross
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 capstone fonttools nsz || python3 -m pip install lz4 capstone fonttools nsz

      - name: 2. 拉取最新 nxnative 源码
        run: |
          git clone --depth 1 https://github.com/seedds/nxnative.git nxnative

      - name: 3. 下载并还原输入文件与密钥
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}
        run: |
          mkdir -p ~/.switch raw_dl extracted_input
          if [ -n "$KEYS_B64" ]; then
            echo "$KEYS_B64" | base64 --decode > ~/.switch/prod.keys
            cp ~/.switch/prod.keys nxnative/prod.keys
          fi
          gh release download "v1.0" --repo "${{ github.repository }}" --dir raw_dl --pattern "nsp_bundle.zip" --clobber
          python3 -c '
          import zipfile, os
          with zipfile.ZipFile("raw_dl/nsp_bundle.zip", "r") as z:
              for info in z.infolist():
                  fname = info.filename.replace("\\", "/")
                  if not fname.endswith("/"):
                      target = os.path.join("extracted_input", fname)
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with open(target, "wb") as out:
                          out.write(z.read(info.filename))
          '
          if [ -d "extracted_input/input_nsp" ]; then
            mv extracted_input/input_nsp/* extracted_input/ || true
          fi
          ls -la extracted_input

      - name: 4. 完美调用官方标准的 build_ipa_from_nsp.py 构建 IPA
        run: |
          cd nxnative
          python3 scripts/build_ipa_from_nsp.py ../extracted_input -k ~/.switch/prod.keys -o "${{ github.workspace }}/nxnative-game-shell.ipa"

          APP_DIR=$(find . -type d -name "*.app" | head -n 1)
          if [ -n "$APP_DIR" ]; then
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.increased-memory-limit bool true" "$APP_DIR/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.extended-virtual-addressing bool true" "$APP_DIR/Info.plist" 2>/dev/null || true
          fi

      - name: 5. 上传生成的无签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-output-ipa
          path: |
            ${{ github.workspace }}/*.ipa
            nxnative/**/*.ipa
          if-no-files-found: error
          retention-days: 3
