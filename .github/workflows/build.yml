name: Build nxnative IPA
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: true
        default: 'v1.1'

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      GAME: "01006BB00C6F0000"
      DM_GAME: "01006BB00C6F0000"
      PKG_VER: "v131072"
      MODS_LIST: "main subsdk0 subsdk1 sdk"
      ROMFS_MARKER: "region_common/shader/postprocess.bfsha"
      OUT_IPA_NAME: "ZeldaLinksAwakening-shell.ipa"
      ZIP_NAME: "exefs_ready_01006BB00C6F0000.zip"
      WORK_DIR: "${{ github.workspace }}/game_work"
      DM_ROOT: "${{ github.workspace }}/game_work"
      WORK: "${{ github.workspace }}/game_work/tmp"
      EXEFS_SRC: "${{ github.workspace }}/extracted_bundle/exefs"
      CTRL_SRC: "${{ github.workspace }}/extracted_bundle/control"
      MINI_ROMFS: "${{ github.workspace }}/extracted_bundle/mini_romfs"
    steps:
      - name: 1. 
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
          xcrun -sdk iphoneos metal -v 2>/dev/null || xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd spirv-cross
          brew install --cask dotnet-sdk || true
          python3 -m pip install --break-system-packages lz4 capstone fonttools || python3 -m pip install lz4 capstone fonttools

      - name: 2.  nxnative TLS + A15 + Documents
        run: |
          git clone --depth 1 https://github.com/seedds/nxnative.git nxnative
          cd nxnative

          #   A:   Nintendo SDK 8.2.0   (  sdk build ID: 3ae34e689d7a35f13cbf42bfd672af8b)
          #   nnMain   StandardAllocator   AllocateTlsSlot  
          python3 -c "import base64; exec(base64.b64decode('').decode('utf-8'))"

          #   B:   project.yml  -mcpu=apple-a18   A15 (iPhone 13)   A18 (16 Pro)  
          python3 -c '
          p = "dm/ios/project.yml"
          s = open(p, "r", encoding="utf-8").read()
          s = s.replace("-mcpu=apple-a18", "-march=armv8.5-a")
          open(p, "w", encoding="utf-8").write(s)
          print("  [OK]  armv8.5-a iPhone 13  16 Pro")
          '

          #   C:   hle_fs.c   Documents/romfs
          python3 -c '
          p = "dm/host/hle_fs.c"
          s = open(p, "r", encoding="utf-8").read()
          old = "const char *v = getenv(var);\n    if (v) return v;"
          new = """if (!strcmp(var, "DM_ROMFS")) {
              const char *h = getenv("HOME");
              if (h) {
                  snprintf(buf, n, "%s/Documents/romfs/" DM_GAME_ROMFS_MARKER, h);
                  if (!access(buf, F_OK)) { snprintf(buf, n, "%s/Documents/romfs", h); return buf; }
                  snprintf(buf, n, "%s/Documents/" DM_GAME_ROMFS_MARKER, h);
                  if (!access(buf, F_OK)) { snprintf(buf, n, "%s/Documents", h); return buf; }
              }
          }
          const char *v = getenv(var);
          if (v) return v;"""
          assert old in s
          open(p, "w", encoding="utf-8").write(s.replace(old, new, 1))
          print("  [OK] Documents/romfs ")
          '

          #   D:   main.c   Documents/aoc   DLC
          python3 -c '
          p = "dm/host/main.c"
          s = open(p, "r", encoding="utf-8").read()
          old = "g_t0_ns = proc_start_mono_ns();"
          new = """g_t0_ns = proc_start_mono_ns();
          if (getenv("HOME")) {
              char aoc_buf[1024];
              snprintf(aoc_buf, sizeof aoc_buf, "%s/Documents/aoc", getenv("HOME"));
              if (!access(aoc_buf, F_OK)) setenv("DM_AOC_DIR", aoc_buf, 1);
          }"""
          assert old in s
          open(p, "w", encoding="utf-8").write(s.replace(old, new, 1))
          print("  [OK] Documents/aoc DLC ")
          '

          #   E: A15   BC (DXT)   (  131 pixelFormat  )
          python3 -c "import base64; exec(base64.b64decode('').decode('utf-8'))"

      - name: 3. 
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}
        run: |
          mkdir -p ~/.switch raw_dl extracted_bundle "$WORK_DIR/tmp" "$WORK_DIR/patched_$PKG_VER" "$WORK_DIR/shader/pkg" "$WORK_DIR/shader/tables" "$WORK_DIR/shader/cache" "$WORK_DIR/shader/ios" "$WORK_DIR/data/$PKG_VER/RomFS" "$WORK_DIR/data/v0" "${{ github.workspace }}/final_output"
          if [ -n "$KEYS_B64" ]; then
            echo "$KEYS_B64" | base64 --decode > ~/.switch/prod.keys
          fi
          gh release download "v1.0" --repo "${{ github.repository }}" --dir raw_dl --pattern "$ZIP_NAME" --clobber
          python3 -c '
          import zipfile, os
          zpath = os.path.join("raw_dl", os.environ["ZIP_NAME"])
          with zipfile.ZipFile(zpath, "r") as z:
              for info in z.infolist():
                  fname = info.filename.replace("\\", "/")
                  if not fname.endswith("/"):
                      target = os.path.join("extracted_bundle", fname)
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with open(target, "wb") as out:
                          out.write(z.read(info.filename))
          '

      - name: 4.  NSO  (patch_nso.py CUT)
        run: |
          cd "${{ github.workspace }}/nxnative"
          for mod in $MODS_LIST; do
            DM_RULESET=native python3 dm/tools/patch_nso.py "$EXEFS_SRC/$mod" "$WORK_DIR/patched_$PKG_VER" "$mod"
          done

      - name: 5.  ( 25,000+ )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${{ github.workspace }}/nxnative"
          NEED_FULL_BUILD=1
          mkdir -p prev_art
          if gh run download 40095010149 -n nxnative-output-ipa --dir prev_art 2>/dev/null || gh run download 40092108924 -n nxnative-output-ipa --dir prev_art 2>/dev/null || gh run download 40085854262 -n nxnative-output-ipa --dir prev_art 2>/dev/null || gh run download 40052586298 -n nxnative-output-ipa --dir prev_art 2>/dev/null; then
            echo "==>  Metal ..."
            python3 -c '
            import zipfile, os
            ipa_path = os.path.join("prev_art", "ZeldaLinksAwakening-shell.ipa")
            work = os.environ["WORK_DIR"]
            game = os.environ["GAME"]
            with zipfile.ZipFile(ipa_path, "r") as z:
                for info in z.infolist():
                    name = info.filename
                    if "Payload/DmIOS.app/msl/" in name:
                        rel = name.split("Payload/DmIOS.app/msl/")[1]
                        if rel:
                            target = os.path.join(work, "shader", "ios", rel)
                            os.makedirs(os.path.dirname(target), exist_ok=True)
                            with open(target, "wb") as f: f.write(z.read(name))
                    elif name == "Payload/DmIOS.app/dm/c1_full.tsv":
                        target = os.path.join("dm/games", game, "c1_full.tsv")
                        with open(target, "wb") as f: f.write(z.read(name))
                    elif name == "Payload/DmIOS.app/dm/cb_extent.tsv":
                        target = os.path.join("dm/games", game, "cb_extent.tsv")
                        with open(target, "wb") as f: f.write(z.read(name))
                    elif name == "Payload/DmIOS.app/dm/pso_manifest.tsv":
                        target = os.path.join("dm/games", game, "pso_manifest.tsv")
                        with open(target, "wb") as f: f.write(z.read(name))
                    elif name == "Payload/DmIOS.app/dm/shader_map.tsv":
                        target = os.path.join("dm/games", game, "shader_map.tsv")
                        with open(target, "wb") as f: f.write(z.read(name))
            print("  [OK] 25,000+  Metal ")
            '
            if [ -f "dm/games/$GAME/c1_full.tsv" ] && [ -d "$WORK_DIR/shader/ios" ]; then
              NEED_FULL_BUILD=0
            fi
          fi

          if [ "$NEED_FULL_BUILD" -eq 1 ]; then
            echo "==> ..."
            python3 dm/gfx/tools/shader_split.py \
              "$MINI_ROMFS" \
              "$EXEFS_SRC/main" \
              "$WORK_DIR/shader/pkg" \
              "$WORK_DIR/shader/tables/shader_map.tsv" \
              "$WORK_DIR/shader/tables/shader_facts.tsv" \
              "$WORK_DIR/shader/tables/shader_pairs.tsv"

            cp -f "$WORK_DIR/shader/tables/shader_map.tsv" "dm/games/$GAME/shader_map.tsv"
            cp -f "$WORK_DIR/shader/tables/shader_pairs.tsv" "dm/games/$GAME/shader_pairs.tsv"

            chmod +x dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate
            python3 dm/gfx/tools/dmsh_chain.py --update-lock
            python3 dm/gfx/tools/dmsh_chain.py --header

            MAIN="$EXEFS_SRC/main" XLATE="$PWD/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate" IOSOUT="$WORK_DIR/shader/ios" J=8 \
              python3 dm/gfx/tools/dmsh_build.py "$WORK_DIR/shader/pkg" "$WORK_DIR/shader/cache"
          fi

      - name: 6.  Xcode  IPA
        run: |
          cd "${{ github.workspace }}/nxnative"
          export USER=$(whoami)
          MARKER_PATH="$WORK_DIR/data/$PKG_VER/RomFS/$ROMFS_MARKER"
          mkdir -p "$(dirname "$MARKER_PATH")"
          touch "$MARKER_PATH"

          cp -f "$EXEFS_SRC/control.nacp" "$WORK_DIR/data/v0/control.nacp"
          cp -f "$EXEFS_SRC/control.nacp" "$WORK_DIR/data/$PKG_VER/control.nacp"

          ICON_FILE=""
          if [ -f "$CTRL_SRC/icon_SimplifiedChinese.dat" ]; then
            cp -f "$CTRL_SRC/icon_SimplifiedChinese.dat" "$WORK_DIR/data/$PKG_VER/icon.jpg"
            ICON_FILE="$WORK_DIR/data/$PKG_VER/icon.jpg"
          elif [ -f "$CTRL_SRC/icon_AmericanEnglish.dat" ]; then
            cp -f "$CTRL_SRC/icon_AmericanEnglish.dat" "$WORK_DIR/data/$PKG_VER/icon.jpg"
            ICON_FILE="$WORK_DIR/data/$PKG_VER/icon.jpg"
          fi

          OUT_IPA="${{ github.workspace }}/final_output/$OUT_IPA_NAME"
          chmod +x dm/ios/tools/build_ipa.sh

          GAME="$GAME" \
          W="$WORK_DIR" \
          PATCHED="$WORK_DIR/patched_$PKG_VER" \
          ROMFS="$WORK_DIR/data/$PKG_VER/RomFS" \
          MSL_IOS="$WORK_DIR/shader/ios" \
          DM_ICON="$ICON_FILE" \
          AOC="" \
          bash dm/ios/tools/build_ipa.sh "$OUT_IPA"

          ls -lh "${{ github.workspace }}/final_output"

      - name: 7.  IPA 
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-output-ipa
          path: ${{ github.workspace }}/final_output/*.ipa
          if-no-files-found: error
          retention-days: 7